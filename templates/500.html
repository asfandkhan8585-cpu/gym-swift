<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Something went wrong — Gym Swift</title>
{% load static %}<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head><body>
<div class="auth-wrap" style="margin-top:70px;max-width:480px;">
  <div class="auth-header" style="background:var(--red,#cc0000);"><div class="auth-logo">Oops</div><div class="auth-sub">Something went wrong</div></div>
  <div class="auth-body" style="text-align:center;">
    <p style="font-size:13px;margin-bottom:10px;">We hit an unexpected problem on our side. Your data is safe.</p>
    <p style="font-size:12px;color:#888;margin-bottom:16px;">Please try again. If it keeps happening, contact your software provider.</p>
    <a href="/" class="btn btn-primary">Back to safety</a>
  </div>
</div>
</body></html>
