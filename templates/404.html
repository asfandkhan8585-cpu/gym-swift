{% extends 'gym/base.html' %}
{% block title %}Not Found{% endblock %}
{% block content %}
<div class="auth-wrap" style="margin-top:60px;max-width:480px;">
  <div class="auth-header"><div class="auth-logo">404</div><div class="auth-sub">Page not found</div></div>
  <div class="auth-body" style="text-align:center;">
    <p style="font-size:13px;margin-bottom:14px;">The page you're looking for doesn't exist or may have moved.</p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
  </div>
</div>
{% endblock %}
